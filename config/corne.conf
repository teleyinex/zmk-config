# Corne ZMK config — nice!nano v2 + nice!view
# Based on typeractive corne-wireless-view

# Wireless range boost
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Eager debouncing
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10

# ZMK Studio — realtime keymap updates over USB
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# Bluetooth profiles
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5

# Remember which base layer (BASE=0 Mac, BASE_LNX=1 Linux/Android) goes with
# each BT profile / endpoint, and reapply it automatically on reconnect or
# reboot — without this, ZMK always boots into layer 0 regardless of which
# profile reconnects.
CONFIG_SETTINGS=y
CONFIG_ZMK_DEFAULT_LAYER=y
CONFIG_ZMK_DEFAULT_LAYER_MIN_INDEX=0
CONFIG_ZMK_DEFAULT_LAYER_MAX_INDEX=1

# Idle sleep (15 min)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
