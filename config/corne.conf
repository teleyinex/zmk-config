# Corne ZMK config — nice!nano v2
# Place this file at: config/corne.conf

# Bluetooth
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5

# Split
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=y

# OLED (ZMK default display, no custom theme)
CONFIG_ZMK_DISPLAY=y

# Power — idle sleep timeout in ms (15 min)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# USB
CONFIG_ZMK_USB=y
