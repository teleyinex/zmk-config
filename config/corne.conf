# Corne ZMK config — nice!nano v2
# Place this file at: config/corne.conf

# ── Bluetooth ──────────────────────────────────────────────────────────────
CONFIG_ZMK_BT_CLEAR_BONDS_HOLD=y       # hold BT_CLR to avoid accidental clear
CONFIG_BT_MAX_CONN=5                    # 5 profiles
CONFIG_BT_MAX_PAIRED=5

# ── Split ──────────────────────────────────────────────────────────────────
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=y

# ── Caps Word ──────────────────────────────────────────────────────────────
CONFIG_ZMK_CAPS_WORD=y

# ── OLED ───────────────────────────────────────────────────────────────────
# Enable if your build has OLED; using ZMK defaults (no custom theme)
CONFIG_ZMK_DISPLAY=y

# ── Power / sleep ──────────────────────────────────────────────────────────
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000   # 15 min (ms) — adjust to taste

# ── USB ────────────────────────────────────────────────────────────────────
CONFIG_ZMK_USB=y
